name: weather_app
description: "Weather forecast app for Ukrainian cities using OpenWeatherMap API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.68.0
  intl: ^0.20.2
  geolocator: ^14.0.2
  flutter_weather_bg_null_safety: ^1.0.0
  audioplayers: ^6.6.0
  geocoding: ^5.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ukrainian_cities.json
    - assets/images/
    - assets/sounds/